<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clearview</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Summary. Utilisation and pressure sit together, because one says how
         hard the machine is working and only the other says whether that is
         a problem. -->
    <header class="summary">
      <div class="stats">
      <div class="stat">
        <div class="stat-label">Processor</div>
        <div class="stat-value num"><span id="cpu-value">—</span><span class="unit">%</span></div>
        <div class="stat-sub" id="cpu-sub">of the whole machine</div>
        <div class="cores" id="cores" aria-hidden="true"></div>
      </div>

      <div class="stat">
        <div class="stat-label">Memory</div>
        <div class="stat-value num"><span id="mem-value">—</span><span class="unit" id="mem-unit">GB</span></div>
        <div class="stat-sub" id="mem-sub">in use</div>
      </div>

      <div class="stat" style="min-width:200px">
        <div class="stat-label">Health</div>
        <div class="verdict" id="verdict" data-level="good" style="margin-top:6px">
          <span class="verdict-dot"></span>
          <span id="verdict-text">Waiting for a second reading…</span>
        </div>
        <div class="stat-sub" id="verdict-sub"></div>
      </div>

      <div class="stat">
        <div class="stat-label">Running</div>
        <div class="stat-value num" id="app-count">—</div>
        <div class="stat-sub" id="proc-count">processes</div>
      </div>

      </div>

      <div class="view-controls">
        <div class="stat-label">View</div>
        <div class="controls" style="margin-top:6px">
          <button class="toggle" id="toggle-translucent" aria-pressed="false"
                  title="See your desktop through the window">Transparent</button>
          <button class="toggle" id="toggle-theme" aria-pressed="false"
                  title="Switch to the light theme">Light</button>
          <button class="toggle" id="toggle-layout" aria-pressed="false"
                  title="Put the list beside the blocks instead of above them">Side by side</button>
        </div>
      </div>
    </header>

    <div class="banner" id="banner" hidden></div>

    <nav class="tabs" role="tablist">
      <button class="tab" id="tab-apps" role="tab" aria-selected="true">Applications</button>
      <button class="tab" id="tab-perf" role="tab" aria-selected="false">Performance</button>
    </nav>

    <div class="view" id="view-apps">

    <!-- The treemap is the hero: area is usage, so the biggest block is the
         answer before a single word is read. -->
    <section class="map-section">
      <div class="section-head">
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb">
          <button class="crumb-back" id="crumb-back" hidden aria-label="Back to all applications">←</button>
          <button class="crumb" id="crumb-root">All applications</button>
          <span class="crumb-sep" id="crumb-sep" hidden>›</span>
          <span class="crumb-current" id="crumb-current" hidden></span>
          <span class="section-note" id="map-note"></span>
        </nav>
        <div class="controls" role="group" aria-label="Metric">
          <button class="toggle" id="metric-cpu" aria-pressed="true">Processor</button>
          <button class="toggle" id="metric-mem" aria-pressed="false">Memory</button>
        </div>
      </div>
      <div class="map" id="map">
        <div class="map-empty" id="map-empty">Measuring…</div>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="list-section">
      <div class="section-head" style="margin-top:var(--s-2)">
        <span class="section-title">Applications</span>
        <div class="list-tools">
          <input class="search" id="list-search" type="search" spellcheck="false"
                 placeholder="Filter by name…" aria-label="Filter applications by name" />
          <div class="controls" role="group" aria-label="Sort by">
            <button class="toggle" data-sort="cpu" aria-pressed="true">Processor</button>
            <button class="toggle" data-sort="mem" aria-pressed="false">Memory</button>
            <button class="toggle" data-sort="name" aria-pressed="false">Name</button>
          </div>
        </div>
      </div>
      <div class="list-hint" id="list-hint" hidden></div>
      <div class="list-scroll" id="list"></div>
    </section>
    </div>

    <div class="view" id="view-perf" hidden>
      <div class="section-head" style="padding:var(--s-5) var(--s-6) 0">
        <div>
          <span class="section-title">Over time</span>
          <span class="section-note" id="perf-note"></span>
        </div>
        <div class="controls" id="ranges" role="group" aria-label="Time range">
          <button class="toggle" data-span="0" aria-pressed="true">Live</button>
          <button class="toggle" data-span="3600" aria-pressed="false">Hour</button>
          <button class="toggle" data-span="86400" aria-pressed="false">Day</button>
          <button class="toggle" data-span="604800" aria-pressed="false">Week</button>
          <button class="toggle" data-span="2678400" aria-pressed="false">Month</button>
        </div>
      </div>

      <div class="charts">
        <figure class="chart-card">
          <figcaption>
            <span class="chart-title">Processor</span>
            <span class="chart-note">percent of the whole machine</span>
          </figcaption>
          <div class="chart" id="chart-cpu"></div>
          <div class="spikes" id="spikes" hidden></div>

          <div class="hardware" id="cpu-hardware"></div>
          <div class="cores-head">
            <span>Per core</span>
            <span class="chart-note" id="cores-note"></span>
          </div>
          <div class="core-grid" id="core-grid"></div>
        </figure>

        <figure class="chart-card">
          <figcaption>
            <span class="chart-title">Memory in use</span>
            <span class="chart-note">excluding reclaimable cache</span>
          </figcaption>
          <div class="chart" id="chart-mem"></div>
          <div class="spikes" id="spikes-mem" hidden></div>
        </figure>

        <figure class="chart-card">
          <figcaption>
            <span class="chart-title">Graphics</span>
            <span class="chart-note" id="gpu-note"></span>
          </figcaption>
          <div class="chart" id="chart-gpu"></div>
          <div class="spikes" id="spikes-gpu" hidden></div>
          <div class="hardware" id="gpu-hardware"></div>
        </figure>

        <figure class="chart-card">
          <figcaption>
            <span class="chart-title">Network</span>
            <span class="chart-note">TCP only for per-app figures — see the note below</span>
          </figcaption>
          <div class="chart" id="chart-net"></div>
          <div class="legend" id="net-legend"></div>
          <div class="spikes" id="spikes-net" hidden></div>
        </figure>

        <figure class="chart-card">
          <figcaption>
            <span class="chart-title">Pressure</span>
            <span class="chart-note">how long anything spent waiting — the difference between busy and struggling</span>
          </figcaption>
          <div class="chart" id="chart-psi"></div>
          <div class="legend" id="psi-legend"></div>
        </figure>
      </div>
    </div>
  </div>

  <aside class="detail" id="detail" data-open="false" aria-hidden="true">
    <button class="close" id="detail-close" aria-label="Close">✕</button>
    <div class="detail-head">
      <h2 class="detail-title" id="detail-title"></h2>
      <div class="detail-sub" id="detail-sub"></div>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </aside>

  <div class="tip" id="tip" role="tooltip" data-show="false"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
