[package]
name = "btm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The desktop application."

# The binary name becomes the Wayland app id, which is what a launcher matches
# against StartupWMClass. Left as "btm-app" the window had no icon anywhere.
[[bin]]
name = "clearview"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
btm-model = { path = "../btm-model" }
btm-probe = { path = "../btm-probe" }
btm-store = { path = "../btm-store" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
