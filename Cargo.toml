[workspace]
resolver = "3"
members = ["crates/btm-probe", "crates/btm-model", "crates/btm-store", "crates/btm-collector", "crates/btm-app"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
